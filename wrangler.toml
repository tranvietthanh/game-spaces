name = "game-deals"
main = "src/index.js"
compatibility_date = "2026-11-19"
workers_dev = true

# Custom domain (registered 19 Nov 2026, zone already active in the account).
[[routes]]
pattern = "freegamesdeals.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "game-deals"
database_id = "a83b9479-7a40-4f78-90de-a628953f3795"

[triggers]
# No scheduled refresh: the Game Deals space pushes fresh data via
# POST /api/sync (see README). A Worker cron here would overwrite it.
crons = []
